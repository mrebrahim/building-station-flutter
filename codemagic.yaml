workflows:
  android-workflow:
    name: Android Build - Building Station
    max_build_duration: 60
    environment:
      flutter: 3.24.0
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Debug APK
        script: flutter build apk --debug --build-name=1.0.0 --build-number=1
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - ebrahimkhli01@gmail.com
        notify:
          success: true
          failure: true
