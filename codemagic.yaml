workflows:
  android-release-aab:
    name: Android Release AAB - Building Station
    max_build_duration: 60
    environment:
      flutter: 3.24.0
      java: 17
      android_signing:
        - building_station_key
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Release AAB
        script: |
          flutter build appbundle --release \
            --build-name=1.1.1 \
            --build-number=4
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      email:
        recipients:
          - ebrahimkhli01@gmail.com
        notify:
          success: true
          failure: true

  android-release-apk:
    name: Android Release APK - Building Station
    max_build_duration: 60
    environment:
      flutter: 3.24.0
      java: 17
      android_signing:
        - building_station_key
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Release APK
        script: |
          flutter build apk --release \
            --build-name=1.1.1 \
            --build-number=4
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - ebrahimkhli01@gmail.com
        notify:
          success: true
          failure: true

  android-debug-apk:
    name: Android Debug APK - Building Station
    max_build_duration: 30
    environment:
      flutter: 3.24.0
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - ebrahimkhli01@gmail.com
        notify:
          success: true
          failure: true
