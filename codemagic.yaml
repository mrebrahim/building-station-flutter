workflows:
  android-release-workflow:
    name: Android Release AAB - Building Station
    max_build_duration: 60
    environment:
      flutter: 3.24.0
      java: 17
      android_signing:
        - building_station_key
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Release AAB
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=1
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      email:
        recipients:
          - ebrahimkhli01@gmail.com
        notify:
          success: true
          failure: true
