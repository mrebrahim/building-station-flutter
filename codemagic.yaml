workflows:
  android-release-aab:
    name: Android Release AAB - Building Station
    max_build_duration: 60
    environment:
      flutter: 3.24.0
      java: 17
      vars:
        KEYSTORE_BASE64: ""
        KEY_ALIAS: "upload"
        KEY_PASSWORD: "Upload2024BS"
        STORE_PASSWORD: "Upload2024BS"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Setup keystore
        script: |
          echo $KEYSTORE_BASE64 | base64 --decode > /tmp/upload-keystore.jks
          echo "storePassword=$STORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=/tmp/upload-keystore.jks" >> android/key.properties
      - name: Build Release AAB
        script: |
          flutter build appbundle --release \
            --build-name=1.1.1 \
            --build-number=4
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      email:
        recipients:
          - ebrahimkhli01@gmail.com
        notify:
          success: true
          failure: true

